name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Universal 2 Release
        run: ./Scripts/build-universal.sh
      - name: Archive app with executable permissions
        run: ditto -c -k --keepParent build/ImageView.app build/ImageView.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ImageView-Universal2
          path: build/ImageView.zip
